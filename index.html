<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Annual Procurement Plan</title>
  <link rel="stylesheet" href="styles.css?v=21" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark brand-logo"><img src="goodspending-logo.png" alt="Good Spending"></div>
      <div>
        <h1 data-i18n="appTitle"></h1>
        <p data-i18n="appSubtitle"></p>
      </div>
    </div>
    <div class="header-actions">
      <span class="demo-badge" data-i18n="demoBadge"></span>
      <div class="lang-switch" aria-label="Language">
        <button data-lang="en" class="active">EN</button><button data-lang="uk">UA</button><button data-lang="pt">PT</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="solution-intro" id="solutionIntro">
      <div class="solution-copy">
        <div class="prod-eyebrow" data-i18n="prodEyebrow"></div>
        <h2 data-i18n="solutionTitle"></h2>
        <p data-i18n="solutionIntro"></p>
        <div class="demo-instructions">
          <strong data-i18n="howToUseTitle"></strong>
          <div class="instruction-actions">
            <button class="instruction-button primary-action" id="ctaRefresh"><span>1</span><strong data-i18n="instructionRefreshTitle"></strong><small data-i18n="howToUse1"></small></button>
            <button class="instruction-button" id="ctaAdd"><span>2</span><strong data-i18n="instructionAddTitle"></strong><small data-i18n="instructionAddText"></small></button>
            <a class="instruction-button disabled" id="ctaAggregation" href="#aggregationSection" aria-disabled="true"><span>3</span><strong data-i18n="instructionAggregationTitle"></strong><small data-i18n="howToUse3"></small></a>
            <a class="instruction-button disabled" id="ctaAi" href="#aiSection" aria-disabled="true"><span>4</span><strong data-i18n="instructionAiTitle"></strong><small data-i18n="howToUse4"></small></a>
          </div>
        </div>
      </div>

      <div class="process-map" aria-label="APP process map">
        <a class="process-input" href="#planSection">
          <span data-i18n="processInput"></span><strong id="processTotal">0</strong><small data-i18n="processRequirements"></small>
        </a>
        <div class="process-branch">
          <a class="engine-card refresh-engine" href="#refreshSection">
            <span class="engine-label" data-i18n="coreEngine"></span>
            <h3 data-i18n="refreshEngineTitle"></h3>
            <p data-i18n="refreshEngineText"></p>
            <div class="engine-metrics"><span><strong id="processOverdue">0</strong> <em data-i18n="overdueShort"></em></span><span><strong id="processRequired">0</strong> <em data-i18n="requiredShort"></em></span><span><strong id="processPipeline">0</strong> <em data-i18n="pipelineShort"></em></span></div>
          </a>
          <a class="engine-card aggregation-engine" href="#aggregationSection">
            <span class="engine-label" data-i18n="coreEngine"></span>
            <h3 data-i18n="aggregationEngineTitle"></h3>
            <p data-i18n="aggregationEngineText"></p>
            <div class="engine-metrics"><span><strong id="processOpportunities">0</strong> <em data-i18n="opportunitiesShort"></em></span><span><strong id="processApproved">0</strong> <em data-i18n="approvedShort"></em></span></div>
          </a>
        </div>
        <div class="process-output-row">
          <a href="#managementSection"><strong data-i18n="effectivePlanOutput"></strong><span data-i18n="effectivePlanText"></span></a>
          <a href="#aiSection"><strong data-i18n="aiOutput"></strong><span data-i18n="aiOutputText"></span></a>
        </div>
      </div>
    </section>

    <section class="section refresh-section" id="refreshSection">
      <div class="section-head">
        <div><h2 data-i18n="refreshPlanTitle"></h2><p class="section-subtitle" data-i18n="refreshPlanIntro"></p></div>
        <div class="refresh-controls"><label class="plan-date"><span data-i18n="planDate"></span><input type="date" id="planDate"></label><button class="primary" id="refreshPlanButton" data-i18n="refreshPlanButton"></button></div>
      </div>
      <div class="pre-refresh-state" id="preRefreshState"><strong data-i18n="emptyDashboardTitle"></strong><span data-i18n="emptyDashboardText"></span></div>
      <div class="kpis hidden" id="kpis"></div>
    </section>

    <section class="section management-section" id="managementSection">
      <div class="section-head">
        <div>
          <h2 data-i18n="managementReview"></h2>
          <p class="section-subtitle" data-i18n="managementIntro"></p>
        </div>
        <span class="step-badge">STEP 4</span>
      </div>
      <div id="managementReview" class="management-review"></div>
    </section>

    <section class="section ai-review-section" id="aiSection">
      <div class="section-head">
        <div>
          <h2 data-i18n="aiReview"></h2>
          <p class="section-subtitle" data-i18n="aiReviewIntro"></p>
        </div>
        <span class="step-badge">STEP 5</span>
      </div>
      <div class="ai-review-toolbar">
        <button class="primary" id="generateAiReview" data-i18n="generateAiReview"></button>
        <button class="secondary" id="showAiFacts" data-i18n="showAiFacts"></button>
        <span class="ai-status" id="aiStatus" aria-live="polite"></span>
      </div>
      <div id="aiFacts" class="ai-facts hidden"></div>
      <div id="aiDeterministicSummary" class="ai-deterministic-summary"></div>
      <div id="aiReviewOutput" class="ai-review-output">
        <div class="review-empty" data-i18n="aiReviewEmpty"></div>
      </div>
      <div class="ai-guardrail" data-i18n="aiGuardrail"></div>
    </section>

    <section class="section" id="planSection">
      <div class="section-head"><h2 data-i18n="procurementPlan"></h2></div>
      <div class="toolbar">
        <input id="searchBox" type="search" data-i18n-placeholder="search" />
        <select id="statusFilter"></select>
        <select id="departmentFilter"></select>
        <button class="secondary" id="resetFilters" data-i18n="resetFilters"></button><button class="secondary danger-outline" id="resetPlan" data-i18n="resetPlan"></button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th data-i18n="title"></th><th data-i18n="department"></th><th data-i18n="unspsc"></th><th data-i18n="value"></th><th data-i18n="needBy"></th><th data-i18n="channel"></th><th data-i18n="startDate"></th><th data-i18n="daysRemaining"></th><th data-i18n="status"></th><th data-i18n="actions"></th>
          </tr></thead>
          <tbody id="planRows"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty hidden" data-i18n="noResults"></div>
    </section>

    <section class="section form-section">
      <div class="section-head"><h2 id="formHeading" data-i18n="addNew"></h2><span class="local-badge" data-i18n="storedLocally"></span></div>
      <form id="requirementForm">
        <div class="form-grid">
          <label><span data-i18n="title"></span><input name="title" required></label>
          <label><span data-i18n="department"></span><select name="department" required></select></label>
          <label class="span-2"><span data-i18n="description"></span><textarea name="description" rows="3" required></textarea></label>
          <label><span data-i18n="unspsc"></span><select name="segment" required></select></label>
          <label><span data-i18n="criticality"></span><select name="criticality" required></select></label>
          <label><span data-i18n="value"></span><input name="estimatedValue" type="number" min="0" step="0.01" required></label>
          <label><span data-i18n="currency"></span><select name="currency"><option>EUR</option><option>USD</option><option>GBP</option></select></label>
          <label><span data-i18n="needBy"></span><input name="needByDate" type="date" required></label>
          <label><span data-i18n="channel"></span><select name="buyingChannel" required></select></label>
          <label class="span-2"><span data-i18n="supplier"></span><input name="supplier"></label>
        </div>
        <div id="formMessage" class="form-message" aria-live="polite"></div>
        <div class="form-actions"><button type="submit" id="submitRequirement" class="primary" data-i18n="addButton"></button><button type="reset" class="secondary" data-i18n="cancel"></button></div>
      </form>
    </section>

    <section class="section aggregation-section" id="aggregationSection">
      <div class="section-head">
        <div>
          <h2 data-i18n="aggregation"></h2>
          <p class="section-subtitle" data-i18n="aggregationIntro"></p>
        </div>
        <span class="step-badge">STEP 3</span>
      </div>
      <div class="aggregation-fx-panel" id="aggregationFxPanel">
        <div><strong data-i18n="aggregationFxTitle"></strong><span data-i18n="aggregationFxIntro"></span></div>
        <label>1 USD = <input id="fxUSD" type="number" min="0.000001" step="any" placeholder="—"> EUR</label>
        <label>1 GBP = <input id="fxGBP" type="number" min="0.000001" step="any" placeholder="—"> EUR</label>
        <p id="aggregationFxMessage" class="aggregation-fx-message" aria-live="polite"></p>
      </div>
      <div class="aggregation-summary" id="aggregationSummary"></div>
      <div class="aggregation-list" id="aggregationList"></div>
      <div id="aggregationEmpty" class="empty hidden" data-i18n="noAggregation"></div>
    </section>

    <section class="section activity-section">
      <div class="section-head">
        <div><h2 data-i18n="activityLog"></h2><p class="section-subtitle" data-i18n="activityIntro"></p></div>
        <button class="secondary" id="clearActivity" data-i18n="clearActivity"></button>
      </div>
      <div id="activityList" class="activity-list"></div>
      <div id="activityEmpty" class="empty hidden" data-i18n="noActivity"></div>
    </section>
  </main>
  <footer data-i18n="footer"></footer>

  <script src="config.js"></script><script src="translations.js"></script><script src="sample-data.js"></script><script src="app.js?v=21"></script>
</body>
</html>
