<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Annual Procurement Plan</title>
  <link rel="stylesheet" href="styles.css?v=16" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">GS</div>
      <div>
        <h1 data-i18n="appTitle"></h1>
        <p data-i18n="appSubtitle"></p>
      </div>
    </div>
    <div class="header-actions">
      <span class="demo-badge" data-i18n="demoBadge"></span>
      <div class="lang-switch" aria-label="Language">
        <button data-lang="en" class="active">EN</button><button data-lang="uk">UA</button><button data-lang="pt">PT</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="prod-preamble">
      <div class="prod-copy">
        <div class="prod-eyebrow" data-i18n="prodEyebrow"></div>
        <h2 data-i18n="prodTitle"></h2>
        <p class="prod-intro" data-i18n="prodIntro"></p>
        <div class="prod-notice" data-i18n="sampleNotice"></div>
        <div class="prod-cta" data-i18n="prodCta"></div>
      </div>
      <div class="prod-features">
        <h3 data-i18n="prodIncludesTitle"></h3>
        <ul>
          <li data-i18n="prodFeatureData"></li>
          <li data-i18n="prodFeatureAutomation"></li>
          <li data-i18n="prodFeatureAggregation"></li>
          <li data-i18n="prodFeatureAudit"></li>
          <li data-i18n="prodFeatureRules"></li>
          <li data-i18n="prodFeatureAI"></li>
          <li data-i18n="prodFeatureIntegration"></li>
        </ul>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 data-i18n="overview"></h2>
        <label class="plan-date"><span data-i18n="planDate"></span><input type="date" id="planDate"></label>
      </div>
      <div class="kpis" id="kpis"></div>
    </section>

    <section class="section management-section">
      <div class="section-head">
        <div>
          <h2 data-i18n="managementReview"></h2>
          <p class="section-subtitle" data-i18n="managementIntro"></p>
        </div>
        <span class="step-badge">STEP 4</span>
      </div>
      <div id="managementReview" class="management-review"></div>
    </section>

    <section class="section ai-review-section">
      <div class="section-head">
        <div>
          <h2 data-i18n="aiReview"></h2>
          <p class="section-subtitle" data-i18n="aiReviewIntro"></p>
        </div>
        <span class="step-badge">STEP 5</span>
      </div>
      <div class="ai-review-toolbar">
        <button class="primary" id="generateAiReview" data-i18n="generateAiReview"></button>
        <button class="secondary" id="showAiFacts" data-i18n="showAiFacts"></button>
        <span class="ai-status" id="aiStatus" aria-live="polite"></span>
      </div>
      <div id="aiFacts" class="ai-facts hidden"></div>
      <div id="aiReviewOutput" class="ai-review-output">
        <div class="review-empty" data-i18n="aiReviewEmpty"></div>
      </div>
      <div class="ai-guardrail" data-i18n="aiGuardrail"></div>
    </section>

    <section class="section">
      <div class="section-head"><h2 data-i18n="procurementPlan"></h2></div>
      <div class="toolbar">
        <input id="searchBox" type="search" data-i18n-placeholder="search" />
        <select id="statusFilter"></select>
        <select id="departmentFilter"></select>
        <button class="secondary" id="resetFilters" data-i18n="resetFilters"></button><button class="secondary danger-outline" id="resetPlan" data-i18n="resetPlan"></button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th data-i18n="title"></th><th data-i18n="department"></th><th data-i18n="unspsc"></th><th data-i18n="value"></th><th data-i18n="needBy"></th><th data-i18n="channel"></th><th data-i18n="startDate"></th><th data-i18n="daysRemaining"></th><th data-i18n="status"></th><th data-i18n="actions"></th>
          </tr></thead>
          <tbody id="planRows"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty hidden" data-i18n="noResults"></div>
    </section>

    <section class="section form-section">
      <div class="section-head"><h2 id="formHeading" data-i18n="addNew"></h2><span class="local-badge" data-i18n="storedLocally"></span></div>
      <form id="requirementForm">
        <div class="form-grid">
          <label><span data-i18n="title"></span><input name="title" required></label>
          <label><span data-i18n="department"></span><select name="department" required></select></label>
          <label class="span-2"><span data-i18n="description"></span><textarea name="description" rows="3" required></textarea></label>
          <label><span data-i18n="unspsc"></span><select name="segment" required></select></label>
          <label><span data-i18n="criticality"></span><select name="criticality" required></select></label>
          <label><span data-i18n="value"></span><input name="estimatedValue" type="number" min="0" step="0.01" required></label>
          <label><span data-i18n="currency"></span><select name="currency"><option>USD</option><option>EUR</option><option>GBP</option><option>UAH</option><option>AED</option></select></label>
          <label><span data-i18n="needBy"></span><input name="needByDate" type="date" required></label>
          <label><span data-i18n="channel"></span><select name="buyingChannel" required></select></label>
          <label class="span-2"><span data-i18n="supplier"></span><input name="supplier"></label>
        </div>
        <div id="formMessage" class="form-message" aria-live="polite"></div>
        <div class="form-actions"><button type="submit" id="submitRequirement" class="primary" data-i18n="addButton"></button><button type="reset" class="secondary" data-i18n="cancel"></button></div>
      </form>
    </section>

    <section class="section aggregation-section">
      <div class="section-head">
        <div>
          <h2 data-i18n="aggregation"></h2>
          <p class="section-subtitle" data-i18n="aggregationIntro"></p>
        </div>
        <span class="step-badge">STEP 3</span>
      </div>
      <div class="aggregation-summary" id="aggregationSummary"></div>
      <div class="aggregation-list" id="aggregationList"></div>
      <div id="aggregationEmpty" class="empty hidden" data-i18n="noAggregation"></div>
    </section>

    <section class="section activity-section">
      <div class="section-head">
        <div><h2 data-i18n="activityLog"></h2><p class="section-subtitle" data-i18n="activityIntro"></p></div>
        <button class="secondary" id="clearActivity" data-i18n="clearActivity"></button>
      </div>
      <div id="activityList" class="activity-list"></div>
      <div id="activityEmpty" class="empty hidden" data-i18n="noActivity"></div>
    </section>
  </main>
  <footer data-i18n="footer"></footer>

  <script src="config.js"></script><script src="translations.js"></script><script src="sample-data.js"></script><script src="app.js?v=16"></script>
</body>
</html>
